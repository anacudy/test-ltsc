on:
  workflow_dispatch:
    inputs:
      ltsc_version:
        type: choice
        options:
          - "2021"
          - "2024"
        default: "2024"
        required: true
      update_uuid:
        type: string
        required: true

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Check Version and UUID
        id: version_uuid
        env:
          LTSC_VERSION: ${{ inputs.ltsc_version }}
          UPDATE_UUID: ${{ inputs.update_uuid }}
        run: |
          $version = $env:LTSC_VERSION.Trim()
          if ($version -notin '2021', '2024') {
            throw "Invalid version: $version"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding ascii

          $uuid = $env:UPDATE_UUID.Trim()
          if ($null -eq ($uuid -as [guid])) {
            throw "Invalid UUID: $uuid"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "uuid=$uuid" -Encoding ascii

      - name: Check Disk
        run: |
          $free = (Get-PSDrive D).Free
          if ($free -le 30GB) {
            throw "D free space is only $free GB"
          }

      - name: Checkout Mine
        uses: actions/checkout@v7

      - name: Checkout W10UI
        uses: actions/checkout@v7
        with:
          repository: abbodi1406/BatUtil
          path: BatUtil

      - name: Download ISO and Update
        run: |
          aria2c --quiet=true --conf-path=aria2.conf --input-file=${{ steps.version_uuid.outputs.version }}.txt
          aria2c --quiet=true --conf-path=aria2.conf "https://uupdump.net/get.php?id=${{ steps.version_uuid.outputs.uuid }}&pack=0&edition=updateOnly&aria2=2"

      - name: ls
        run: ls
