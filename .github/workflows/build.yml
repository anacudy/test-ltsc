on:
  workflow_dispatch:
    inputs:
      ltsc_version:
        type: choice
        options:
          - "2021"
          - "2024"
        default: "2024"
        required: true
      update_uuid:
        type: string
        required: true

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Check UUID
        id: check_uuid
        env:
          UPDATE_UUID: ${{ inputs.update_uuid }}
        run: |
          $uuid = $env:UPDATE_UUID.Trim()
          if ($null -eq ($uuid -as [guid])) {
            throw "Invalid UUID: $uuid"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "uuid=$uuid" -Encoding ascii

      - name: Check Disk
        run: |
          $free = (Get-PSDrive D).Free
          if ($free -le 30GB) {
            throw "D free space is only $free GB"
          }

      - name: Checkout Mine
        uses: actions/checkout@v7

      - name: Checkout W10UI
        uses: actions/checkout@v7
        with:
          repository: abbodi1406/BatUtil
          path: BatUtil

      - name: Download
        run: |

          aria2c --quiet=true --input-file=2024.txt --conf-path=aria2.conf
